<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Impact Apex</title>

<style>
body {
  margin: 0;
  overflow: hidden;
  background: #020617;
}

/* GRID */
body::before {
  content: "";
  position: fixed;
  width: 100%;
  height: 100%;
  background-image: 
    linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px);
  background-size: 40px 40px;
  z-index: -2;
}

/* GLOW */
body::after {
  content: "";
  position: fixed;
  top: -20%;
  left: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(34,197,94,0.25), transparent 70%);
  filter: blur(100px);
  z-index: -1;
}

.glow2 {
  position: fixed;
  bottom: -20%;
  right: -10%;
  width: 600px;
  height: 600px;
  background: radial-gradient(circle, rgba(56,189,248,0.25), transparent 70%);
  filter: blur(120px);
  z-index: -1;
}

/* APP FRAME */
iframe {
  position: relative;
  z-index: 1;
  width: 100vw;
  height: 100vh;
  border: none;
}
</style>
</head>

<body>

<div class="glow2"></div>

<iframe src="https://impactapex.lovable.app"></iframe>

</body>
</html>
